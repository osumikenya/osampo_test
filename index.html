/**
 * 2点間の距離（メートル）をHaversine公式で算出
 */
function calculateDistanceMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000; // 地球の半径 (m)
    const toRad = (deg) => (deg * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) *
            Math.cos(toRad(lat2)) *
            Math.sin(dLng / 2) *
            Math.sin(dLng / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}
/**
 * 【セキュリティ防衛①】クライアントサイド・ジオフェンストランケーション
 * 取得したGPS座標が自宅から指定半径（例: 200m）以内にあるかを判定。
 * true の場合、呼び出し元でその座標データ自体を即座に破棄（記録しない）する。
 */
function isInsideHomeGeofence(currentLat, currentLng, homeLat, homeLng, radiusMeters) {
    if (homeLat === null || homeLng === null || radiusMeters <= 0) {
        return false;
    }
    const distance = calculateDistanceMeters(currentLat, currentLng, homeLat, homeLng);
    return distance <= radiusMeters;
}
/**
 * 【セキュリティ防衛②】自宅中心座標のランダムオフセット生成（逆算防止）
 * 自宅登録時に真の現在地から 距離30m〜70m・方位0°〜360° のランダムなズレを加え、
 * 「オフセット済み中心座標」のみを返す。真の自宅座標は破棄される。
 * マスク半径150m〜200mに対して最大70mのズレであれば、真の自宅は常にマスク円内（境界から最低80m〜130m以上奥）に保護される。
 */
function applyHomeRandomOffset(rawLat, rawLng, minOffsetMeters = 30, maxOffsetMeters = 70) {
    // ランダムな距離 (30m 〜 70m)
    const distance = minOffsetMeters + Math.random() * (maxOffsetMeters - minOffsetMeters);
    // ランダムな方位 (0 〜 2π)
    const angle = Math.random() * 2 * Math.PI;
    const R = 6371000; // 地球半径 (m)
    const latRad = (rawLat * Math.PI) / 180;
    // 緯度・経度の変化量（ラジアン）
    const deltaLat = (distance * Math.cos(angle)) / R;
    const deltaLng = (distance * Math.sin(angle)) / (R * Math.cos(latRad));
    return {
        offsetLat: rawLat + (deltaLat * 180) / Math.PI,
        offsetLng: rawLng + (deltaLng * 180) / Math.PI,
    };
}
/**
 * 2点間の移動速度（km/h）を算出
 */
function calculateSpeedKmh(distanceMeters, timeDiffMs) {
    if (timeDiffMs <= 0)
        return 0;
    const hours = timeDiffMs / (1000 * 60 * 60);
    const kilometers = distanceMeters / 1000;
    return kilometers / hours;
}
/**
 * 飼い主の消費カロリー（kcal）を算出
 * 犬の散歩（METs = 3.0）× 飼い主の体重(kg) × 時間(h) × 1.05
 */
function calculateOwnerCalories(durationSec, ownerWeightKg) {
    const hours = durationSec / 3600;
    const mets = 3.0;
    return Math.round(mets * ownerWeightKg * hours * 1.05);
}
/**
 * 【セキュリティ防衛③】写真のExif情報（GPS座標・端末情報等）の完全削除
 * HTML5 Canvasにピクセルデータのみを再描画することで、元のExifメタデータを完全に消去する。
 */
async function stripImageExifAndResize(file, maxWidth = 1080) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(objectUrl);
            const scale = img.width > maxWidth ? maxWidth / img.width : 1;
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                reject(new Error('Canvas context unavailable'));
                return;
            }
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            // JPEGとして再エンコードすることでExifメタデータを完全消去
            const safeDataUrl = canvas.toDataURL('image/jpeg', 0.85);
            resolve(safeDataUrl);
        };
        img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error('Failed to load image'));
        };
        img.src = objectUrl;
    });
}


// --- db.ts ---
const DB_NAME = 'KunKatsuLocalDB';
const DB_VERSION = 1;
const STORE_PROFILE = 'profile';
const STORE_WALKS = 'walks';
function openDB() {
    return new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') {
            reject(new Error('IndexedDB is not supported'));
            return;
        }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(STORE_PROFILE)) {
                db.createObjectStore(STORE_PROFILE, { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains(STORE_WALKS)) {
                db.createObjectStore(STORE_WALKS, { keyPath: 'id' });
            }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}
async function getDogProfile() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_PROFILE, 'readonly');
        const store = tx.objectStore(STORE_PROFILE);
        const req = store.get('default_dog');
        req.onsuccess = () => {
            if (req.result) {
                const stored = req.result;
                const normalizedStaleDays = typeof stored.staleRouteDays === 'number' && Number.isFinite(stored.staleRouteDays)
                    ? Math.min(60, Math.max(3, Math.round(stored.staleRouteDays)))
                    : 14;
                resolve({
                    ...stored,
                    staleRouteDays: normalizedStaleDays,
                });
            }
            else {
                const defaultProfile = {
                    id: 'default_dog',
                    name: '愛犬',
                    breed: 'ゴールデンレトリバー',
                    birthDate: '2023-05-01',
                    weightKg: 28,
                    ownerWeightKg: 65,
                    homeLat: null,
                    homeLng: null,
                    geofenceRadiusMeters: 200, // 確定仕様: 初期値200m (下限150m)
                    mapboxPublicToken: '',
                    soundFeedbackEnabled: false,
                    staleRouteDays: 14,
                };
                resolve(defaultProfile);
            }
        };
        req.onerror = () => reject(req.error);
    });
}
async function saveDogProfile(profile) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_PROFILE, 'readwrite');
        tx.objectStore(STORE_PROFILE).put(profile);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}
async function getAllWalks() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_WALKS, 'readonly');
        const store = tx.objectStore(STORE_WALKS);
        const req = store.getAll();
        req.onsuccess = () => {
            const list = req.result || [];
            list.sort((a, b) => b.startTime - a.startTime);
            resolve(list);
        };
        req.onerror = () => reject(req.error);
    });
}
async function saveWalkSession(walk) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_WALKS, 'readwrite');
        tx.objectStore(STORE_WALKS).put(walk);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}
/**
 * 指定した散歩記録を1件削除する
 */
async function deleteWalkSession(walkId) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_WALKS, 'readwrite');
        tx.objectStore(STORE_WALKS).delete(walkId);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}
/**
 * 指定した複数の散歩記録を単一トランザクションで一括削除する
 */
async function deleteWalkSessions(walkIds) {
    if (walkIds.length === 0)
        return;
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_WALKS, 'readwrite');
        const store = tx.objectStore(STORE_WALKS);
        walkIds.forEach((id) => {
            store.delete(id);
        });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

// --- shareCard.ts ---
const SHARE_CARD_FONT = "'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif";
function shareCardFormatDuration(totalSec) {
    const mins = Math.floor(totalSec / 60);
    const secs = totalSec % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}
/**
 * 古いSafari互換の角丸矩形パス描画ヘルパー（ctx.roundRect非依存・arcTo実装）
 * 単一HTMLバンドル連結時の名前衝突を避けるため shareCard 接頭辞を付与
 */
function shareCardRoundRect(ctx, x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
}
/**
 * 肉球（Paw）を描画するヘルパー関数
 * 背景装飾やアクセントとして使用（単一HTML連結時の衝突回避のため接頭辞付与）
 */
function shareCardDrawPaw(ctx, cx, cy, size, rotRad, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotRad);
    ctx.fillStyle = color;
    // 掌球（中央下の横長楕円）
    ctx.beginPath();
    ctx.ellipse(0, size * 0.15, size * 0.42, size * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();
    // 指球4つ（トウパッド）
    const toes = [
        { x: -size * 0.38, y: -size * 0.16, rx: size * 0.12, ry: size * 0.15, rot: -0.35 },
        { x: -size * 0.14, y: -size * 0.35, rx: size * 0.13, ry: size * 0.17, rot: -0.1 },
        { x: size * 0.14, y: -size * 0.35, rx: size * 0.13, ry: size * 0.17, rot: 0.1 },
        { x: size * 0.38, y: -size * 0.16, rx: size * 0.12, ry: size * 0.15, rot: 0.35 },
    ];
    toes.forEach((t) => {
        ctx.beginPath();
        ctx.ellipse(t.x, t.y, t.rx, t.ry, t.rot, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.restore();
}
/**
 * 防犯保護済みシェア画像（記録カード）のCanvas生成・Blob変換関数
 * - 地図背景を描画せず、防犯マスク外の抽象ルート軌跡とアクションピンのみを描画
 * - Exif等の位置情報メタデータを含まないクリーンなPNG Blobを出力
 */
function generateShareCardBlob(walk, dogName = '愛犬') {
    return new Promise((resolve, reject) => {
        try {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 1000;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                reject(new Error('Canvas 2D context is not available'));
                return;
            }
            // 1. 背景（あたたかいクリーム背景）
            const grad = ctx.createLinearGradient(0, 0, 0, 1000);
            grad.addColorStop(0, '#FFF7EC');
            grad.addColorStop(1, '#FDF0DE');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 800, 1000);
            // 1.5 背景の薄い肉球装飾（透明度 0.05〜0.07 程度のやさしいコーラル）
            const pawPats = [
                { cx: 720, cy: 75, size: 48, rot: 0.35, color: 'rgba(240, 101, 58, 0.07)' },
                { cx: 620, cy: 110, size: 28, rot: -0.4, color: 'rgba(240, 101, 58, 0.05)' },
                { cx: 760, cy: 380, size: 38, rot: 0.2, color: 'rgba(240, 101, 58, 0.05)' },
                { cx: 35, cy: 520, size: 34, rot: -0.25, color: 'rgba(240, 101, 58, 0.05)' },
                { cx: 80, cy: 925, size: 54, rot: -0.3, color: 'rgba(240, 101, 58, 0.06)' },
                { cx: 720, cy: 915, size: 58, rot: 0.28, color: 'rgba(240, 101, 58, 0.06)' },
            ];
            pawPats.forEach((p) => {
                shareCardDrawPaw(ctx, p.cx, p.cy, p.size, p.rot, p.color);
            });
            // 2. ヘッダー（丸ゴシック見出し＋おうちバレ防止バッジ）
            const safeDogName = dogName.trim() || '愛犬';
            const titleText = `🐕 ${safeDogName}のおさんぽのきろく`;
            let titleFontSize = 34;
            ctx.fillStyle = '#292524';
            ctx.font = `bold ${titleFontSize}px ${SHARE_CARD_FONT}`;
            while (titleFontSize > 26 && ctx.measureText(titleText).width > 704) {
                titleFontSize -= 2;
                ctx.font = `bold ${titleFontSize}px ${SHARE_CARD_FONT}`;
            }
            ctx.fillText(titleText, 48, 70, 704);
            const dateStr = new Date(walk.startTime).toLocaleDateString('ja-JP');
            ctx.fillStyle = '#78716C';
            ctx.font = `bold 20px ${SHARE_CARD_FONT}`;
            ctx.fillText(`📅 ${dateStr}`, 48, 110);
            // おうちバレ防止ピルバッジ
            const badgeX = 230;
            const badgeY = 84;
            const badgeW = 356;
            const badgeH = 34;
            shareCardRoundRect(ctx, badgeX, badgeY, badgeW, badgeH, 17);
            ctx.fillStyle = '#ECFDF5';
            ctx.fill();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#A7F3D0';
            ctx.stroke();
            ctx.fillStyle = '#047857';
            ctx.font = `bold 16px ${SHARE_CARD_FONT}`;
            ctx.fillText('🏠 おうちのまわりはかくして作成済', badgeX + 16, badgeY + 23);
            // 3. ルート抽象描画カード（白い角丸カード・地図背景は描かず自宅特定を完全防止）
            ctx.save();
            ctx.shadowColor = 'rgba(240, 101, 58, 0.08)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 6;
            shareCardRoundRect(ctx, 48, 140, 704, 460, 28);
            ctx.fillStyle = '#FFFFFF';
            ctx.fill();
            ctx.restore();
            shareCardRoundRect(ctx, 48, 140, 704, 460, 28);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#FFEDD5';
            ctx.stroke();
            // ルート描画キャンバスの内側背景（白縁ピンがシールのように映える淡いアイボリー）
            shareCardRoundRect(ctx, 64, 156, 672, 428, 20);
            ctx.fillStyle = '#FFFDF9';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#FFF0DB';
            ctx.stroke();
            // 左上ミニラベル
            shareCardRoundRect(ctx, 80, 172, 180, 30, 15);
            ctx.fillStyle = '#FFF7EC';
            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#FED7AA';
            ctx.stroke();
            ctx.fillStyle = '#78716C';
            ctx.font = `bold 14px ${SHARE_CARD_FONT}`;
            ctx.fillText('🐾 おさんぽルート', 96, 192);
            const pts = walk.routePoints;
            if (pts.length >= 2) {
                const lats = pts.map((p) => p.lat);
                const lngs = pts.map((p) => p.lng);
                const minLat = Math.min(...lats);
                const maxLat = Math.max(...lats);
                const minLng = Math.min(...lngs);
                const maxLng = Math.max(...lngs);
                const latSpan = Math.max(maxLat - minLat, 0.0005);
                const lngSpan = Math.max(maxLng - minLng, 0.0005);
                const toX = (lng) => 116 + ((lng - minLng) / lngSpan) * 568;
                const toY = (lat) => 536 - ((lat - minLat) / latSpan) * 320;
                // ルート線の淡いフチ（立体感）
                ctx.save();
                ctx.strokeStyle = 'rgba(240, 101, 58, 0.2)';
                ctx.lineWidth = 14;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                pts.forEach((p, idx) => {
                    const x = toX(p.lng);
                    const y = toY(p.lat);
                    if (idx === 0)
                        ctx.moveTo(x, y);
                    else
                        ctx.lineTo(x, y);
                });
                ctx.stroke();
                // メインのコーラル色ルート線 (#F0653A)
                ctx.strokeStyle = '#F0653A';
                ctx.lineWidth = 7;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                pts.forEach((p, idx) => {
                    const x = toX(p.lng);
                    const y = toY(p.lat);
                    if (idx === 0)
                        ctx.moveTo(x, y);
                    else
                        ctx.lineTo(x, y);
                });
                ctx.stroke();

            label: `${month + 1}月`,

        const monthBucket = monthBucketMap.get(localDate.getFullYear() * 12 + localDate.getMonth());

            monthBucket.durationSec += duration;
            monthBucket.walkCount += 1;

        weeklyComparisonPercent: latestWeek && prevWeek

        cells,

 * localStorage 利用不可時やデータ破損時は例外を投げず null を返す。
 */
function readWeatherCache(lat, lng, nowMs = Date.now()) {

        if (ageMs < 0 || ageMs >= WEATHER_CACHE_TTL_MS)
            return null;

        const targetLng = roundWeatherCoord(lng);
        const latDiff = Math.round(Math.abs(targetLat - parsed.roundedLat) * 100) / 100;
        const lngDiff = Math.round(Math.abs(targetLng - parsed.roundedLng) * 100) / 100;

            lngDiff >= WEATHER_CACHE_COORD_DIFF_LIMIT) {
            return null;
        }
        return {
            ...parsed,
            roundedLat: roundWeatherCoord(parsed.roundedLat),
            roundedLng: roundWeatherCoord(parsed.roundedLng),

 * 保存不可環境（プライベートブラウズ制限等）では例外を握りつぶして安全に無視する。
 */
function writeWeatherCache(snapshot) {
    try {
        if (typeof localStorage === 'undefined')
            return;
        const safeSnapshot = {
            ...snapshot,
            roundedLat: roundWeatherCoord(snapshot.roundedLat),
            roundedLng: roundWeatherCoord(snapshot.roundedLng),
        };
        localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(safeSnapshot));
    }
    catch {

    }
}
/**
 * 現在地の天気スナップショットを取得する（30分キャッシュ優先・5秒タイムアウト）。
 * 将来のAPI差し替え時は本関数内部のみを差し替える想定。
 */
async function fetchWeatherSnapshot(lat, lng, forceRefresh = false) {
    const roundedLat = roundWeatherCoord(lat);
    const roundedLng = roundWeatherCoord(lng);
    if (!forceRefresh) {
        const cached = readWeatherCache(roundedLat, roundedLng);
        if (cached) {
            return cached;
        }
    }
    const url = buildOpenMeteoUrl(roundedLat, roundedLng);
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), WEATHER_FETCH_TIMEOUT_MS);
    try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) {
            throw new Error(`天気APIがエラーを返しました (HTTP ${response.status})`);
        }
        const json = await response.json();
        const snapshot = parseOpenMeteoResponse(json, roundedLat, roundedLng);
        writeWeatherCache(snapshot);
        return snapshot;
    }
    finally {
        clearTimeout(timeoutId);
    }
}

    for (const point of snapshot.hourlyNext3h) {
        if (point.precipitationProbability !== null &&
            (maxRainProb3h === null || point.precipitationProbability > maxRainProb3h)) {
            maxRainProb3h = point.precipitationProbability;
        }
        if (point.precipitationMm > maxRainMm3h) {
            maxRainMm3h = point.precipitationMm;
        }

        point.precipitationMm >= CLIMATE_RAIN_MM_THRESHOLD);

    const isColdCaution = snapshot.apparentTemperatureC <= thresholds.coldCautionC;

        matchedTags.push('heat_caution');
    if (isColdCaution)
        matchedTags.push('cold_caution');
    if (isWindCaution)
        matchedTags.push('wind_caution');

            ? snapshot.sunsetIso
            : snapshot.sunsetIso.slice(0, 16);

            nowMs >= sunsetMs - CLIMATE_SUNSET_REMINDER_BEFORE_MS;
        if (!snapshot.isDay || isNearOrAfterSunset) {
            sunsetReminder = 'ライト・反射材を忘れずに';
        }

    else if (!snapshot.isDay) {
        sunsetReminder = '夜間はライトや反射材の着用が安心です';
    }

    let headline = `体感${Math.round(snapshot.apparentTemperatureC)}℃・過ごしやすい気候です`;
    let advice = '愛犬の様子を見ながら、いつものペースで気持ちよくお散歩できそうです。';
    switch (severity) {
        case 'heat_danger':
            label = '暑さ警戒';
            headline = `体感${Math.round(snapshot.apparentTemperatureC)}℃・暑さがかなり強めです`;
            advice =
                'アスファルトの熱さに注意し、涼しい時間帯や日陰中心の短いコースがおすすめです。';
            break;
        case 'rain_alert':
            label = '雨予報';
            if (maxRainMm3h >= 0.1) {
                headline = `3時間以内に雨 最大${maxRainMm3h.toFixed(1)}mm`;
            }
            else if (maxRainProb3h !== null) {
                headline = `3時間以内の降水確率 ${Math.round(maxRainProb3h)}%`;
            }
            else {
                headline = '降水確率は取得できませんでした';
            }
            advice =
                '雨が降りやすい予報です。レインコートの準備や、お散歩時間の前倒しをご検討ください。';
            break;
        case 'heat_caution':
            label = '暑さ注意';
            headline = `体感${Math.round(snapshot.apparentTemperatureC)}℃・やや暑めです`;
            advice =
                '日差しや地面の照り返しに気をつけて、こまめな休憩と水分補給を意識しましょう。';
            break;
        case 'cold_caution':
            label = '寒さ注意';
            headline = `体感${Math.round(snapshot.apparentTemperatureC)}℃・ひんやりしています`;
            advice =
                '冷え込みが気になる気温です。愛犬のふるえなど様子を見つつ、ウェア着用や短めの調整が安心です。';

            break;
        case 'good':
            break;
    }
    return {
        severity,
        label,
        headline,
        advice,
        secondaryTags,
        maxRainProb3h,
        maxRainMm3h,
        sunsetTimeLabel,
        sunsetReminder,
        thresholds,

}

/**
 * 距離（メートル）をモバイル表示に適した単位（m / km）へ整形する
 */
function formatDistanceLabel(meters) {
    if (!Number.isFinite(meters) || meters <= 0) {
        return '0 m';
    }
    if (meters < 1000) {
        return `${Math.round(meters).toLocaleString('ja-JP')} m`;
    }
    const km = meters / 1000;
    const formattedKm = km >= 100
        ? km.toFixed(1)
        : km.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
    return `${formattedKm} km`;
}
/**
 * 秒数を日本語の時間表記（例: 1時間25分 / 12分30秒 / 45秒）へ整形する
 */
function formatDurationLabel(seconds) {
    if (!Number.isFinite(seconds) || seconds <= 0) {
        return '0秒';
    }
    const totalSec = Math.round(seconds);
    const hours = Math.floor(totalSec / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);
    const secs = totalSec % 60;
    if (hours > 0) {
        return `${hours.toLocaleString('ja-JP')}時間${mins}分`;
    }
    if (mins > 0) {
        return `${mins}分${secs}秒`;
    }
    return `${secs}秒`;
}
/**
 * 時速（km/h）を整形する。算出不能時（null / 非有限値）は "-- km/h" を返す
 */
function formatSpeedLabel(speedKmh) {
    if (speedKmh === null || !Number.isFinite(speedKmh) || speedKmh < 0) {

    return `${speedKmh.toFixed(1)} km/h`;
}
/**
 * パーセンテージを小数第1位まで整形する

function formatPercentLabel(percent) {
    if (!Number.isFinite(percent) || percent <= 0) {

    return `${clamped.toFixed(1)}%`;
