/**
 * 2点間の距離（メートル）をHaversine公式で算出
 */
function calculateDistanceMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000; // 地球の半径 (m)
    const toRad = (deg) => (deg * Math.PI) / 180;
    const dLat = toRad(lat2 - lat1);
    const dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) *
            Math.cos(toRad(lat2)) *
            Math.sin(dLng / 2) *
            Math.sin(dLng / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}
/**
 * 【セキュリティ防衛①】クライアントサイド・ジオフェンストランケーション
 * 取得したGPS座標が自宅から指定半径（例: 200m）以内にあるかを判定。
 * true の場合、呼び出し元でその座標データ自体を即座に破棄（記録しない）する。
 */
function isInsideHomeGeofence(currentLat, currentLng, homeLat, homeLng, radiusMeters) {
    if (homeLat === null || homeLng === null || radiusMeters <= 0) {
        return false;
    }
    const distance = calculateDistanceMeters(currentLat, currentLng, homeLat, homeLng);
    return distance <= radiusMeters;
}
/**
 * 【セキュリティ防衛②】自宅中心座標のランダムオフセット生成（逆算防止）
 * 自宅登録時に真の現在地から 距離30m〜70m・方位0°〜360° のランダムなズレを加え、
 * 「オフセット済み中心座標」のみを返す。真の自宅座標は破棄される。
 * マスク半径150m〜200mに対して最大70mのズレであれば、真の自宅は常にマスク円内（境界から最低80m〜130m以上奥）に保護される。
 */
function applyHomeRandomOffset(rawLat, rawLng, minOffsetMeters = 30, maxOffsetMeters = 70) {
    // ランダムな距離 (30m 〜 70m)
    const distance = minOffsetMeters + Math.random() * (maxOffsetMeters - minOffsetMeters);
    // ランダムな方位 (0 〜 2π)
    const angle = Math.random() * 2 * Math.PI;
    const R = 6371000; // 地球半径 (m)
    const latRad = (rawLat * Math.PI) / 180;
    // 緯度・経度の変化量（ラジアン）
    const deltaLat = (distance * Math.cos(angle)) / R;
    const deltaLng = (distance * Math.sin(angle)) / (R * Math.cos(latRad));
    return {
        offsetLat: rawLat + (deltaLat * 180) / Math.PI,
        offsetLng: rawLng + (deltaLng * 180) / Math.PI,
    };
}
/**
 * 2点間の移動速度（km/h）を算出
 */
function calculateSpeedKmh(distanceMeters, timeDiffMs) {
    if (timeDiffMs <= 0)
        return 0;
    const hours = timeDiffMs / (1000 * 60 * 60);
    const kilometers = distanceMeters / 1000;
    return kilometers / hours;
}
/**
 * 飼い主の消費カロリー（kcal）を算出
 * 犬の散歩（METs = 3.0）× 飼い主の体重(kg) × 時間(h) × 1.05
 */
function calculateOwnerCalories(durationSec, ownerWeightKg) {
    const hours = durationSec / 3600;
    const mets = 3.0;
    return Math.round(mets * ownerWeightKg * hours * 1.05);
}
/**
 * 【セキュリティ防衛③】写真のExif情報（GPS座標・端末情報等）の完全削除
 * HTML5 Canvasにピクセルデータのみを再描画することで、元のExifメタデータを完全に消去する。
 */
async function stripImageExifAndResize(file, maxWidth = 1080) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(objectUrl);
            const scale = img.width > maxWidth ? maxWidth / img.width : 1;
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                reject(new Error('Canvas context unavailable'));
                return;
            }
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            // JPEGとして再エンコードすることでExifメタデータを完全消去
            const safeDataUrl = canvas.toDataURL('image/jpeg', 0.85);
            resolve(safeDataUrl);
        };
        img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error('Failed to load image'));
        };
        img.src = objectUrl;
    });
}


// --- db.ts ---
const DB_NAME = 'KunKatsuLocalDB';
const DB_VERSION = 1;
const STORE_PROFILE = 'profile';
const STORE_WALKS = 'walks';
function openDB() {
    return new Promise((resolve, reject) => {
        if (typeof indexedDB === 'undefined') {
            reject(new Error('IndexedDB is not supported'));
            return;
        }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(STORE_PROFILE)) {
                db.createObjectStore(STORE_PROFILE, { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains(STORE_WALKS)) {
                db.createObjectStore(STORE_WALKS, { keyPath: 'id' });
            }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}
async function getDogProfile() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_PROFILE, 'readonly');
        const store = tx.objectStore(STORE_PROFILE);
        const req = store.get('default_dog');
        req.onsuccess = () => {
            if (req.result) {
                resolve(req.result);
            }
            else {
                const defaultProfile = {
                    id: 'default_dog',
                    name: '愛犬',
                    breed: 'ゴールデンレトリバー',
                    birthDate: '2023-05-01',
                    weightKg: 28,
                    ownerWeightKg: 65,
                    homeLat: null,
                    homeLng: null,
                    geofenceRadiusMeters: 200, // 確定仕様: 初期値200m (下限150m)
                    mapboxPublicToken: '',
                    soundFeedbackEnabled: false,
                };
                resolve(defaultProfile);
            }
        };
        req.onerror = () => reject(req.error);
    });
}
async function saveDogProfile(profile) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_PROFILE, 'readwrite');
        tx.objectStore(STORE_PROFILE).put(profile);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}
async function getAllWalks() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_WALKS, 'readonly');
        const store = tx.objectStore(STORE_WALKS);
        const req = store.getAll();
        req.onsuccess = () => {
            const list = req.result || [];
            list.sort((a, b) => b.startTime - a.startTime);
            resolve(list);
        };
        req.onerror = () => reject(req.error);
    });
}
async function saveWalkSession(walk) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_WALKS, 'readwrite');
        tx.objectStore(STORE_WALKS).put(walk);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

// --- shareCard.ts ---
function formatDuration(totalSec) {
    const mins = Math.floor(totalSec / 60);
    const secs = totalSec % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}
/**
 * 防犯保護済みシェア画像（リザルトカード）のCanvas生成・Blob変換関数
 * - 地図背景を描画せず、防犯マスク外の抽象ルート軌跡とアクションピンのみを描画
 * - Exif等の位置情報メタデータを含まないクリーンなPNG Blobを出力
 */
function generateShareCardBlob(walk, dogName = '愛犬') {
    return new Promise((resolve, reject) => {
        try {
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 1000;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                reject(new Error('Canvas 2D context is not available'));
                return;
            }
            // 背景グラデーション
            const grad = ctx.createLinearGradient(0, 0, 0, 1000);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 800, 1000);
            // ヘッダー
            ctx.fillStyle = '#10b981';
            ctx.font = 'bold 34px sans-serif';
            ctx.fillText(`🐕 ${dogName}のお散歩＆クン活ログ`, 48, 72);
            ctx.fillStyle = '#94a3b8';
            ctx.font = '20px sans-serif';
            const dateStr = new Date(walk.startTime).toLocaleDateString('ja-JP');
            ctx.fillText(`${dateStr}  |  🛡️ 自宅周辺マスク保護済（座標・住所非表示）`, 48, 110);
            // ルート抽象描画ボックス（地図背景を描画せず軌跡形状とクン活ピンのみ描画して自宅特定を完全防止）
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(48, 140, 704, 460);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.strokeRect(48, 140, 704, 460);
            const pts = walk.routePoints;
            if (pts.length >= 2) {
                const lats = pts.map((p) => p.lat);
                const lngs = pts.map((p) => p.lng);
                const minLat = Math.min(...lats);
                const maxLat = Math.max(...lats);
                const minLng = Math.min(...lngs);
                const maxLng = Math.max(...lngs);
                const latSpan = Math.max(maxLat - minLat, 0.0005);
                const lngSpan = Math.max(maxLng - minLng, 0.0005);
                const toX = (lng) => 108 + ((lng - minLng) / lngSpan) * 584;
                const toY = (lat) => 540 - ((lat - minLat) / latSpan) * 340;
                ctx.strokeStyle = '#10b981';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.beginPath();
                pts.forEach((p, idx) => {
                    const x = toX(p.lng);
                    const y = toY(p.lat);
                    if (idx === 0)
                        ctx.moveTo(x, y);
                    else
                        ctx.lineTo(x, y);
                });
                ctx.stroke();
                // クン活・排泄ピン描画
                walk.actionLogs.forEach((log) => {
                    const x = toX(log.lng);
                    const y = toY(log.lat);
                    ctx.beginPath();
                    ctx.arc(x, y, log.weight >= 3 ? 10 : 7, 0, Math.PI * 2);
                    ctx.fillStyle =
                        log.type === 'sniff_manual' || log.type === 'sniff_auto'
                            ? '#f59e0b'
                            : log.type === 'pee'
                                ? '#38bdf8'
                                : '#a855f7';
                    ctx.fill();
                });
            }
            else {
                ctx.fillStyle = '#64748b';
                ctx.font = '22px sans-serif';
                ctx.fillText('ルート軌跡（防犯マスク外）', 260, 370);
            }
            // 4指標パネル
            const stats = [
                { label: '移動距離', val: `${walk.distanceMeters} m`, color: '#22d3ee' },
                { label: 'お散歩時間', val: formatDuration(walk.durationSec), color: '#34d399' },
                { label: 'クン活合計時間', val: formatDuration(walk.sniffDurationSec), color: '#fbbf24' },
                { label: '飼い主消費カロリー', val: `${walk.ownerCaloriesKcal} kcal`, color: '#fb7185' },
            ];
            stats.forEach((st, idx) => {
                const col = idx % 2;
                const row = Math.floor(idx / 2);
                const bx = 48 + col * 360;
                const by = 630 + row * 145;
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(bx, by, 344, 125);
                ctx.fillStyle = '#94a3b8';
                ctx.font = '20px sans-serif';
                ctx.fillText(st.label, bx + 24, by + 42);
                ctx.fillStyle = st.color;
                ctx.font = 'bold 38px monospace';
                ctx.fillText(st.val, bx + 24, by + 95);
            });
            // Canvas から PNG Blob を生成
            canvas.toBlob((blob) => {
                if (blob) {
                    resolve(blob);
                }
                else {
                    reject(new Error('Canvas toBlob returned null'));
                }
            }, 'image/png');
        }
        catch (error) {
            reject(error);
        }
    });
}


// --- DualMap.tsx ---
function DualMap({ engine, mapboxToken, darkMode, centerLat, centerLng, routePoints, actionLogs, activeLayer, }) {
    const containerRef = useRef(null);
    const mapInstanceRef = useRef(null);
    const isLoadedRef = useRef(false);
    // タイルソース切替（OSM標準 ⇄ 国土地理院タイル）
    const [tileProvider, setTileProvider] = useState('osm');
    const latestPropsRef = useRef({ routePoints, actionLogs, activeLayer });
    latestPropsRef.current = { routePoints, actionLogs, activeLayer };
    // GeoJSON生成ヘルパー
    const createRouteGeoJson = (pts) => ({
        type: 'FeatureCollection',
        features: pts.length >= 2
            ? [
                {
                    type: 'Feature',
                    geometry: {
                        type: 'LineString',
                        coordinates: pts.map((p) => [p.lng, p.lat]),
                    },
                },
            ]
            : [],
    });
    const createPointsGeoJson = (logs, layer) => ({
        type: 'FeatureCollection',
        features: logs
            .filter((log) => {
            if (layer === 'sniff')
                return log.type === 'sniff_auto' || log.type === 'sniff_manual';
            if (layer === 'excretion')
                return log.type === 'pee' || log.type === 'poop';
            return true;
        })
            .map((log) => ({
            type: 'Feature',
            properties: {
                weight: log.weight,
                type: log.type,
                durationSec: log.durationSec,
            },
            geometry: {
                type: 'Point',
                coordinates: [log.lng, log.lat],
            },
        })),
    });
    // 1. 地図インスタンスの初期化
    useEffect(() => {
        if (!containerRef.current)
            return;
        isLoadedRef.current = false;
        if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
        }
        const useMapbox = engine === 'mapbox' && mapboxToken.trim().length > 10;
        // APIキー完全不要・WebWorker不要で確実に描画されるラスタータイル方式
        const rasterTiles = tileProvider === 'osm'
            ? ['https://tile.openstreetmap.org/{z}/{x}/{y}.png']
            : ['https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png'];
        const rasterAttribution = tileProvider === 'osm'
            ? '© OpenStreetMap contributors'
            : '© 国土地理院 (GSI Japan)';
        const rasterStyle = {
            version: 8,
            sources: {
                'raster-tiles': {
                    type: 'raster',
                    tiles: rasterTiles,
                    tileSize: 256,
                    attribution: rasterAttribution,
                },
            },
            layers: [
                {
                    id: 'base-raster-layer',
                    type: 'raster',
                    source: 'raster-tiles',
                    minzoom: 0,
                    maxzoom: 19,
                    paint: {
                        // 真っ暗にならず夜間でも道路・公園がはっきり見える明るさを維持
                        'raster-brightness-max': darkMode ? 0.88 : 1.0,
                        'raster-contrast': darkMode ? 0.08 : 0,
                    },
                },
            ],
        };
        let map;
        if (useMapbox) {
            mapboxgl.accessToken = mapboxToken.trim();
            map = new mapboxgl.Map({
                container: containerRef.current,
                style: darkMode
                    ? 'mapbox://styles/mapbox/dark-v11'
                    : 'mapbox://styles/mapbox/streets-v12',
                center: [centerLng, centerLat],
                zoom: 15.5,
            });
        }
        else {
            map = new maplibregl.Map({
                container: containerRef.current,
                style: rasterStyle,
                center: [centerLng, centerLat],
                zoom: 15.5,
            });
        }
        mapInstanceRef.current = map;
        map.on('load', () => {
            isLoadedRef.current = true;
            map.resize();
            const { routePoints: currentRoutes, actionLogs: currentLogs, activeLayer: currentLayer, } = latestPropsRef.current;
            // ルート軌跡ソース＆レイヤー
            map.addSource('walk-route', {
                type: 'geojson',
                data: createRouteGeoJson(currentRoutes),
            });
            map.addLayer({
                id: 'walk-route-line',
                type: 'line',
                source: 'walk-route',
                layout: {
                    'line-join': 'round',
                    'line-cap': 'round',
                },
                paint: {
                    'line-color': currentLayer === 'route' ? '#10b981' : '#3b82f6',
                    'line-width': currentLayer === 'route' ? 7 : 4,
                    'line-opacity': 0.85,
                },
            });
            // アクションポイント（クン活・排泄）ソース＆ヒートマップ
            map.addSource('action-points', {
                type: 'geojson',
                data: createPointsGeoJson(currentLogs, currentLayer),
            });
            map.addLayer({
                id: 'kunkatsu-heatmap',
                type: 'heatmap',
                source: 'action-points',
                paint: {
                    'heatmap-weight': ['get', 'weight'],
                    'heatmap-intensity': 1.5,
                    'heatmap-color': [
                        'interpolate',
                        ['linear'],
                        ['heatmap-density'],
                        0,
                        'rgba(0, 0, 255, 0)',
                        0.2,
                        'rgba(16, 185, 129, 0.5)',
                        0.5,
                        'rgba(250, 204, 21, 0.8)',
                        0.8,
                        'rgba(249, 115, 22, 0.9)',
                        1,
                        'rgba(239, 68, 68, 1)',
                    ],
                    'heatmap-radius': 28,
                    'heatmap-opacity': 0.85,
                },
            });
            // ピン丸印
            map.addLayer({
                id: 'action-circles',
                type: 'circle',
                source: 'action-points',
                paint: {
                    'circle-radius': [
                        'match',
                        ['get', 'type'],
                        'sniff_manual',
                        8,
                        'poop',
                        8,
                        'pee',
                        7,
                        5,
                    ],
                    'circle-color': [
                        'match',
                        ['get', 'type'],
                        'sniff_manual',
                        '#f59e0b',
                        'sniff_auto',
                        '#fde047',
                        'pee',
                        '#38bdf8',
                        'poop',
                        '#a855f7',
                        '#ffffff',
                    ],
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#1f2937',
                },
            });
        });
        // リサイズ監視（タブ切替時や画面サイズ変更時）
